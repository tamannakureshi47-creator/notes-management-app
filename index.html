<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <h4 class="brand">
                NOTES
            </h4>

            <p class="add-label">
                Add New
            </p>

            <button class="add-note-btn"
                data-bs-toggle="modal"
                data-bs-target="#noteModal"
                id="addNoteBtn">

                <i class="bi bi-plus-circle"></i>

                Note

            </button>


            <!-- Sidebar Links -->

            <div class="side-links">

                <button class="side-link active"
                    data-view="notes">

                    <i class="bi bi-journal-text"></i>

                    My Notes

                </button>


                <button class="side-link"
                    data-view="calendar">

                    <i class="bi bi-calendar3"></i>

                    Calendar

                </button>


                <button class="side-link"
                    data-view="archive">

                    <i class="bi bi-archive"></i>

                    Archive

                </button>


                <button class="side-link"
                    data-view="trash">

                    <i class="bi bi-trash"></i>

                    Trash

                </button>

            </div>


            <!-- Upgrade -->

            <div class="upgrade">

                <div class="upgrade-icon">

                    <i class="bi bi-lock-fill"></i>

                </div>

                <p>
                    Access unlimited folders & features
                </p>

                <button class="upgrade-btn">
                    Upgrade Pro
                </button>

            </div>

        </aside>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">


            <!-- Top Bar -->

            <div class="topbar">

                <div>

                    <h1 id="pageTitle">
                        MY NOTES
                    </h1>

                    <p id="pageSubtitle">
                        Keep your ideas organized in one place.
                    </p>

                </div>


                <!-- Search -->

                <div class="search-box">

                    <i class="bi bi-search"></i>

                    <input type="text"
                        id="searchInput"
                        placeholder="Search...">

                </div>

            </div>



            <!-- ================= RECENT FOLDER ================= -->

            <section class="section">

                <div class="section-heading">

                    <h5>
                        Recent Folder
                    </h5>

                    <button class="new-folder-btn"
                        id="newFolderBtn">

                        <i class="bi bi-folder-plus"></i>

                        New Folder

                    </button>

                </div>


                <div class="folder-grid"
                    id="folderList">

                </div>

            </section>



            <!-- ================= NOTES ================= -->

            <section class="section">

                <div class="section-heading">

                    <h5 id="notesHeading">
                        My Notes
                    </h5>

                    <span id="noteCount">
                        0 notes
                    </span>

                </div>


                <div class="notes-grid"
                    id="notesList">

                </div>


                <!-- Empty State -->

                <div class="empty-state"
                    id="emptyState">

                    <div class="empty-icon">

                        <i class="bi bi-journal-plus"></i>

                    </div>

                    <h5>
                        No notes found
                    </h5>

                    <p>
                        Create your first note using the
                        <strong>+ Note</strong> button.
                    </p>

                    <button class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#noteModal">

                        <i class="bi bi-plus"></i>

                        Add Note

                    </button>

                </div>

            </section>

        </main>

    </div>



    <!-- ================================================= -->
    <!-- ADD / EDIT NOTE MODAL -->
    <!-- ================================================= -->

    <div class="modal fade"
        id="noteModal"
        tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <!-- Modal Header -->

                <div class="modal-header">

                    <h5 class="modal-title"
                        id="modalTitle">

                        Add Note

                    </h5>


                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>



                <!-- Form -->

                <form id="noteForm">

                    <div class="modal-body">


                        <!-- Hidden Edit Index -->

                        <input type="hidden"
                            id="editIndex">



                        <!-- Title -->

                        <div class="form-group">

                            <input type="text"
                                id="noteTitle"
                                placeholder="Note Title"
                                maxlength="100"
                                required>

                        </div>



                        <!-- Text -->

                        <div class="form-group">

                            <textarea id="noteText"
                                rows="5"
                                placeholder="Write something..."
                                maxlength="3000"
                                required></textarea>

                        </div>



                        <!-- Date & Time -->

                        <div class="row">

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label>
                                        Date
                                    </label>

                                    <input type="date"
                                        id="noteDate">

                                </div>

                            </div>


                            <div class="col-md-6">

                                <div class="form-group">

                                    <label>
                                        Time
                                    </label>

                                    <input type="time"
                                        id="noteTime">

                                </div>

                            </div>

                        </div>



                        <!-- Folder -->

                        <div class="form-group">

                            <label>
                                Folder
                            </label>

                            <select id="noteFolder">

                                <option value="">
                                    No Folder
                                </option>

                            </select>

                        </div>



                        <!-- File -->

                        <div class="form-group">

                            <label>
                                File
                            </label>

                            <input type="file"
                                id="noteFile">

                            <small>
                                Optional file attachment
                            </small>

                            <div id="currentFile"></div>

                        </div>


                    </div>



                    <!-- Footer -->

                    <div class="modal-footer">

                        <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Close

                        </button>


                        <button type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-check2"></i>

                            Save

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- NEW FOLDER MODAL -->
    <!-- ================================================= -->

    <div class="modal fade"
        id="folderModal"
        tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        New Folder
                    </h5>

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>


                <form id="folderForm">

                    <div class="modal-body">

                        <input type="text"
                            id="folderName"
                            class="form-control"
                            placeholder="Folder name"
                            required>

                    </div>


                    <div class="modal-footer">

                        <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancel

                        </button>


                        <button type="submit"
                            class="btn btn-primary">

                            Create

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JS -->

    <script src="script.js"></script>

</body>

</html>
